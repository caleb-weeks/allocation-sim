# Lint/typecheck, test (TypeScript + Python + Postgres-backed API), then deploy the API to the GCP VM.
# The web app deploys through Vercel's GitLab integration (root directory: apps/web).

stages: [check, test, deploy]

default:
  image: node:22-bookworm
  interruptible: true

variables:
  PNPM_HOME: /pnpm
  PNPM_STORE_DIR: .pnpm-store

.pnpm: &pnpm
  before_script:
    - npm install -g pnpm@10
    - pnpm install --frozen-lockfile
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]

typecheck:
  stage: check
  <<: *pnpm
  script:
    - pnpm --filter @allocation-sim/engine build
    - pnpm -r typecheck

engine:
  stage: test
  <<: *pnpm
  script:
    - pnpm --filter @allocation-sim/engine test
    - pnpm --filter @allocation-sim/web test

python:
  stage: test
  image: python:3.13-slim
  before_script:
    - pip install -r python/requirements.txt
  script:
    - cd python
    - python -m pytest -q
    # The TypeScript engine is tested against this fixture; make sure it matches the Python reference.
    - python -m reference.cross_check --check
    - python -m pipeline.build_seed --check

api:
  stage: test
  <<: *pnpm
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_DB: allocation_sim_test
    POSTGRES_USER: ci
    POSTGRES_PASSWORD: ci
    DATABASE_URL: postgresql://ci:ci@postgres:5432/allocation_sim_test
    TEST_DATABASE_URL: postgresql://ci:ci@postgres:5432/allocation_sim_test
  script:
    - pnpm --filter @allocation-sim/engine build
    - pnpm --filter @allocation-sim/api exec prisma generate
    - pnpm --filter @allocation-sim/api test

deploy-api:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_HOST
      when: manual
  environment:
    name: production
    url: https://$API_HOSTNAME
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - ssh allocation@$DEPLOY_HOST "/srv/allocation-sim/infra/vm/deploy.sh"
